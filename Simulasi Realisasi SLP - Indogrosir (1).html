<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Realisasi SLP - Indogrosir</title>
<style>
:root{--bg:#eef3f9;--ink:#0b4ea2;--card:#fff;--mut:#51627a;--line:#c9d6e6;--ok:#1a7f4b;--err:#c0262d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--ink:#7fb2ff;--card:#17253a;--mut:#9fb2cc;--line:#2c4160;--ok:#4fd08c;--err:#ff7b80}}
:root[data-theme="dark"]{--bg:#0f1824;--ink:#7fb2ff;--card:#17253a;--mut:#9fb2cc;--line:#2c4160;--ok:#4fd08c;--err:#ff7b80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
.wrap{max-width:420px;margin:0 auto;padding:16px;display:block}
.panel{display:none}
html{-webkit-text-size-adjust:100%}
button,.menu li,.tabs button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select{font-size:16px}
.phone{height:min(600px,calc(100dvh - 32px))}
.phone{margin:0 auto}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
/* handheld */
.phone{background:#fafafa;color:#111;border:1px solid #9aa;border-radius:6px;overflow:hidden;width:100%;max-width:380px;height:600px;display:flex;flex-direction:column;position:relative;font-size:16px}
.bar{background:#0070c8;color:#fff;padding:10px 14px;display:flex;gap:14px;align-items:center;flex:none}
.bar b{display:block;font-size:17px;font-weight:600}.bar small{font-size:13px}
.burger{font-size:22px;line-height:1}
.screen{flex:1;overflow:auto;position:relative}
.logo{margin:14px auto;width:230px;background:linear-gradient(#0070c8 0 28%,#fff 28% 72%,#d32f2f 72%);padding:16px 0;text-align:center}
.logo span{display:inline-block;background:#fff;border-radius:8px;padding:4px 12px;color:#0b4ea2;font:italic 900 26px Arial,sans-serif;letter-spacing:-1px}
.logo span i{color:#d32f2f;font-style:normal}
.row{display:flex;align-items:center;gap:10px;margin:10px 18px}
.row label{width:96px;text-align:right;font-size:15px}
.login .row label{font-weight:600;font-size:17px;width:90px;text-align:left}
input,select{font:inherit;color:#111;background:#fff;border:1px solid #333;padding:3px 6px;min-width:0}
.login input{border:0;border-bottom:1px solid #888;background:transparent;width:100%}
.login input:focus{border-bottom:2px solid #d81b60;outline:0}
.btns{display:flex;gap:30px;margin:22px 18px}
.btn{border:1px solid #444;background:#fff;border-radius:4px;padding:10px 0;flex:1;font:inherit;cursor:pointer;color:#111}
.menu{list-style:none;margin:0;padding:0}
.menu li{padding:14px 18px;border-bottom:1px solid #ddd;color:#444;cursor:pointer;font-size:16px}
.menu li:before{content:"\2335";font-size:11px;margin-right:12px;color:#777}
.menu li.sub{padding-left:40px;color:#555}.menu li.sub:before{content:""}
.menu li.open:before{content:"\2303"}
.ver{text-align:center;font-size:12px;color:#444;margin-bottom:6px}
.tabs{display:flex;background:#9e9e9e}
.tabs button{flex:1;background:none;border:0;padding:12px 0;font:600 12px Arial,sans-serif;cursor:pointer;color:#111}
.tabs button.on,.tabs button:active{background:#e0e0e0;color:#111}
.plu{background:#39ff14;padding:8px 14px;font-size:18px;color:#111;min-height:38px}
.desc{font-weight:700;margin:10px 18px 0}
.form .row{margin:7px 14px}
.form .row label{width:100px}
.form input.s{width:58px}.form input.w{flex:1}
input:disabled{color:#888;background:#f3f3f3;border-color:#888}
.save{display:block;margin:12px auto;border:1px solid #444;background:#fff;border-radius:4px;padding:6px 10px;font-size:28px;cursor:pointer}
.foot{background:#0070c8;color:#fff;font-size:12px;padding:8px 14px;min-height:34px;flex:none}
.dlg-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5}
.dlg{background:#fff;width:84%;border-radius:4px;padding:22px 22px 14px}
.dlg h4{margin:0 0 14px;font-size:20px}.dlg div{display:flex;justify-content:flex-end;gap:20px;margin-top:40px}
.dlg button{background:none;border:0;color:#d81b60;font:600 15px Arial,sans-serif;padding:10px 12px;cursor:pointer}
.hl{outline:3px dotted #0b4ea2;outline-offset:3px;border-radius:6px}
.menu li.sel,.menu li:active{background:#e3e3e3}
#bc:focus{background:#e6e6e6;outline:0}
.btn:active{background:#e3e3e3}
.dd{position:relative;margin-left:-10px;display:inline-flex}
.dd button{width:36px;border:1px solid #333;background:#fff;border-radius:4px;color:#111;font-size:11px;cursor:pointer}
.dd button:disabled{color:#888;cursor:default}
.dlg .pk{margin-top:8px;justify-content:space-between;gap:8px}.dlg .pk select{flex:1;padding:8px 4px}
.burger{cursor:pointer}
.spb{background:#fff;display:flex;flex-direction:column}
.spb .sy{background:#ffe6a5;padding:8px 12px;flex:none}
.spb .r{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px}
.spb label{width:40px}
.spb input{border:1px solid #777;background:#fff;height:28px;padding:0 4px}
.spb input.pl{width:120px}
.spb input.q{width:54px}
.spb input:disabled,.spb input.g{background:#c8c8c8;color:#777;border-color:#c8c8c8}
.cari{background:#aef0fb;border:1px solid #333;padding:4px 22px;font:13px Arial,sans-serif;cursor:pointer;color:#111}
.dsc{margin:6px 0 2px;font-size:17px;min-height:50px}
.er{color:#c0262d;font-size:13px;min-height:16px}
.spb .gr{background:#9a9a9a;height:120px;flex:none}
.loc{background:#0a89c9;color:#111;padding:6px 14px;font-size:14px}
.spb .b{padding-bottom:14px}
.bt{display:flex;justify-content:center;gap:50px;margin-top:10px}
.sub1{background:#3a8f00;color:#fff;border:1px solid #1d5200;border-radius:3px;padding:7px 16px;font:12px Arial,sans-serif;cursor:pointer}
.clr{background:#f3d9b0;border:1px solid #777;border-radius:3px;padding:7px 16px;font:12px Arial,sans-serif;cursor:pointer;color:#111}
.wh{flex:1;background:#fff;min-height:40px}
.spt{background:#fff;display:flex;flex-direction:column}
.spt .ty{background:#fff2a1;padding:8px 12px;flex:none}
.spt .r{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px}
.spt input{border:1px solid #777;background:#fff;height:28px;padding:0 4px}
.spt input:disabled{background:#c8c8c8;color:#777;border-color:#c8c8c8}
.spt input.rk{width:140px}.spt input.lk{width:150px}.spt input.pl2{width:84px}.spt input.fr{width:84px}.spt input.q2{width:62px}
.carir{background:#0070c8;border:1px solid #004a8a;color:#111;padding:4px 24px;font:13px Arial,sans-serif;cursor:pointer}
.spt .er{min-height:14px;margin:0}
.spt .tl{background:#95958d;height:175px;overflow:auto;flex:none}
.cd{padding:8px 12px;cursor:pointer;border-bottom:1px solid #85857d}.cd.on{background:rgba(0,0,0,.2)}
.g2{display:grid;grid-template-columns:128px 1fr;row-gap:2px;font-size:14px;color:#5b5b53}
.g2 .i{padding-left:14px}.g2 .nm{grid-column:1/-1;padding-left:14px;font-weight:700}
.nt{padding:14px;color:#3c3c36;font-size:14px}
.dsc2{font-size:18px;min-height:46px;margin:4px 0}
.spt .tb{padding-bottom:14px}
.spr .ty{background:#fbcd85}
.spr input.lk{flex:1;width:auto;min-width:0}
.spk .ty{background:#e6ccfa}
.spk .tl{background:#928f95}
.spk input.rk{flex:1;min-width:0}
.carik{background:#a8f0f8;border:1px solid #333;border-radius:4px;padding:4px 20px;font:13px Arial,sans-serif;cursor:pointer;color:#111}
.dk{font-size:16px;min-height:62px;padding-left:12px;line-height:1.3}
.lc{padding:8px;font-size:15px;color:#111;border-bottom:2px solid #222;margin:0 6px}
.spq{background:#dff6fd;display:flex;flex-direction:column}
.spq .qa{padding:8px 10px;flex:none}
.spq .r{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:16px}
.spq input{border:1px solid #333;background:#fff;height:28px;padding:0 4px}
.spq input.qp{width:90px}
.spq input.g1{width:64px;background:#c8c8c8;color:#777;border-color:#c8c8c8}
.qd{font-size:20px;min-height:58px;margin:6px 0 0;line-height:1.25;color:#111}
.spq .er{min-height:14px;margin:0 0 8px}
.qh{display:grid;grid-template-columns:1.4fr 1fr 1fr;background:#fff;border-top:2px solid #222;border-bottom:2px solid #222;padding:8px;font-size:14px;text-align:center;color:#111;flex:none}
.tq{background:#97959b;flex:1;min-height:150px}
.qr{display:grid;grid-template-columns:1.4fr 1fr 1fr;background:#fff;padding:12px 8px;margin-bottom:6px;font-size:13px;border-bottom:3px double #555;color:#111}
.qr span:nth-child(2){text-align:center}.qr span:nth-child(3){text-align:right;font-size:15px}
.sol{background:#f5dffa;padding:10px 14px}
.sol .r{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:16px}
.sol label{min-width:92px;text-align:right;color:#111}
.sol input{border:1px solid #333;background:#fff;height:28px;padding:0 4px}
.sol input:disabled,.sol input.g{background:#c8c8c8;color:#777;border-color:#c8c8c8}
.sol input.wide{flex:1;min-width:0}.sol input.q{width:62px}.sol input.ex{width:150px}
.edit{background:#e07cf5;border:1px solid #333;border-radius:4px;padding:4px 14px;font:13px Arial,sans-serif;cursor:pointer;color:#111}
.ddb2{width:34px;height:28px;border:1px solid #333;background:#fff;border-radius:4px;font-size:10px;cursor:pointer;color:#111;padding:0}
.ddb2:disabled{color:#888;cursor:default}
.dsc3{font-size:19px;min-height:58px;line-height:1.25;color:#111;padding:2px 6px}
.bt3{display:flex;justify-content:center;gap:12px;margin-top:14px}
.hap{background:#aef0fb;border:1px solid #444;border-radius:3px;padding:7px 18px;font:12px Arial,sans-serif;cursor:pointer;color:#111}
.ssr{background:#c8f6fb;display:flex;flex-direction:column}
.ssr .ta{padding:8px 10px;flex:none}
.ssr .r{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px;color:#111}
.ssr input{border:1px solid #333;background:#fff;height:28px;padding:0 4px}
.ssr input:disabled,.ssr input.g{background:#c8c8c8;color:#777;border-color:#c8c8c8}
.ssr input.wide{flex:1;min-width:0}.ssr input.q{width:64px}.ssr input.ex{width:140px}.ssr input.pl3{width:100px}.ssr input.f2{width:64px}
.carik2{background:#bdf3fa;border:1px solid #333;border-radius:3px;padding:3px 18px;font:13px Arial,sans-serif;cursor:pointer;color:#111}
.bl{background:#adadad;height:205px;overflow:auto;border:1px solid #666;flex:none;margin:0 6px}
.bc{padding:4px 8px;border-bottom:3px solid #6e6e6e;cursor:pointer;font-size:12px;color:#444}.bc.on{background:rgba(0,0,0,.2)}
.b2{display:grid;grid-template-columns:52% 1fr}
.bn{font-weight:700;font-size:13px;color:#111;padding:2px 8px}
.ssr .bf{padding:8px 12px}
.ssr .bt3{margin-top:10px}
.sdt{background:#7a7a7a;padding:8px 10px}
.sdt .r{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px;color:#111}
.sdt input{border:1px solid #333;background:#fff;height:28px;padding:0 4px}
.sdt input:disabled,.sdt input.g{background:#c8c8c8;color:#777;border-color:#c8c8c8}
.sdt input.rk{width:150px}.sdt input.f1{width:66px}
.dsc4{font-size:17px;min-height:56px;color:#111;line-height:1.25}
.th,.tr{display:grid;grid-template-columns:1.7fr .7fr .7fr;background:#fff;border:2px solid #000;font-size:13px;color:#111}
.th span,.tr span{padding:3px 4px;border-right:1px solid #000}.th span:last-child,.tr span:last-child{border-right:0}
.tr{margin-top:3px;border-bottom:4px solid #000;cursor:pointer}
.tbx{background:#adadad;min-height:200px;border:1px solid #333;padding-bottom:6px}.tbx.w{background:#fff}
.pop{background:#8c8c8c;width:88%;padding:16px 12px;border:1px solid #444}
.pop .r{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#222}
.pop input.q{width:64px;height:30px;border:1px solid #333;background:#fff;padding:0 4px}
.pop .bt{display:flex;justify-content:center;gap:18px;margin-top:14px}
.dd input{position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.dlg button:active,.dlg button:focus{background:#e6e6e6;outline:0}
.note{margin:18px;padding:14px;border:1px dashed #888;color:#555;font-size:14px}
.err{color:#c0262d;margin:6px 18px;font-size:13px;min-height:16px}
.done{text-align:center;padding:36px 20px}.done .t{font-size:56px;color:#1a7f4b}
/* panel */
.panel h1{font-size:clamp(28px,4.2vw,44px);line-height:1.3;margin:6px 0 18px;font-weight:800}
.panel ul{font-size:clamp(22px,3vw,32px);font-weight:800;line-height:1.5;margin:0 0 20px;padding-left:28px}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.chk label{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:17px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px;color:var(--mut);font-size:15px}
.box h3{margin:0 0 8px;font-size:16px;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td button{font:inherit;cursor:pointer;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 8px}
.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--mut);margin-bottom:6px}
.top button,.reset{font:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
.steps{display:flex;gap:6px;margin:0 0 14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff9800;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div id="phone" class="phone" aria-label="Simulasi layar handheld"></div>
  <div class="panel">
    <div class="top">
      <label><input type="checkbox" id="guide" checked> Tampilkan panduan</label>
      <button id="reset">Ulangi dari awal</button>
    </div>
    <div class="steps" id="steps"></div>
    <div id="instr"></div>
    <div class="box"><h3>Data barcode untuk uji coba</h3>
      <table><thead><tr><th>Barcode SLP</th><th>Produk</th><th></th></tr></thead><tbody id="tb"></tbody></table>
      <p style="margin:10px 0 0">Ketik barcode di kolom Barcode SLP lalu tekan Enter (seperti hasil scan). Barcode lain akan ditolak.</p>
    </div>
    <div class="box" id="logbox" hidden><h3>Riwayat realisasi pada sesi ini</h3><div id="log"></div></div>
  </div>
</div>
<script>
const DB={
"437709":{plu:"1604780",frac:24,nama:"DORITOS JGG BKR 120G",lok:"R09A.01.B.04.4",ctn:0,pcs:13,exp:"01-07-2026"},
"512340":{plu:"1021355",frac:12,nama:"INDOMIE GORENG 85G",lok:"R02B.03.A.01.2",ctn:3,pcs:0,exp:"15-03-2027"},
"698210":{plu:"2001873",frac:6,nama:"SUSU UHT COKLAT 1L",lok:"R05C.02.C.02.1",ctn:2,pcs:4,exp:"10-12-2026"},
"8998866501279":{plu:"1100001",frac:24,nama:"NUVO FAMILY MILD PROTECT 50 SHEETS",lok:"R08B.02.B.05.2",ctn:2,pcs:0,exp:"01-12-2031"},
"8996001600375":{plu:"1100002",frac:24,nama:"LE MINERAL 330ML",lok:"R011.01.B.01.1",ctn:24,pcs:0,exp:"01-12-2029"},
"8997008191224":{plu:"1100003",frac:12,nama:"SP TROCHES STR 6'S",lok:"O06.03.i02.01.3",ctn:0,pcs:35,exp:"02-02-2029"},
"8997235180916":{plu:"1100004",frac:12,nama:"INDOMARET AIR MINERAL 1L",lok:"R011.01.B.01.2",ctn:40,pcs:0,exp:"02-02-2029"}};
const S={scr:"login",user:"",tab:"buat",open:false,slp:false,item:null,dlg:false,err:"",log:[],seen:{lok:false,qty:false,exp:false}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IP="192.168.83.83";
function bar(){
  if(S.scr==="login")return `<div class="bar"><b>HANDHELD 192.168.249.194</b></div>`;
  if(S.scr==="sol")return `<div class="bar"><span class="burger">\u2261</span><div><b>SO Per Lokasi :</b><small>192.168.249.124 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="ssr")return `<div class="bar"><span class="burger">\u2261</span><div><b>SO Per Sub Rak :</b><small>192.168.150.124 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="sdt")return `<div class="bar"><span class="burger">\u2261</span><div><b>SO Display Toko :</b><small>192.168.150.124 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="inq")return `<div class="bar"><span class="burger">\u2261</span><div><b>Inquiry Plano :</b><small>192.168.245.150 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="spk")return `<div class="bar"><span class="burger">\u2261</span><div><b>SPB TOKO KHUSUS :</b><small>192.168.245.150 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="spr")return `<div class="bar"><span class="burger">\u2261</span><div><b>SPB TOKO REALISASI :</b><small>192.168.150.57 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="spt")return `<div class="bar"><span class="burger">\u2261</span><div><b>SPB TOKO PENURUNAN :</b><small>192.168.249.124 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="spb")return `<div class="bar"><span class="burger">\u2261</span><div><b>SPB TOKO INPUT :</b><small>192.168.83.158 ${esc(S.user)}</small></div></div>`;
  if(S.scr==="menu")return `<div class="bar"><span class="burger">\u2261</span><div><b>Menu Utama</b><small>192.168.148.233 MRA</small></div></div>`;
  return `<div class="bar"><span class="burger">\u2261</span><div><b>User ID : ${esc(S.user)}</b><small>${IP} ${esc(S.user)}</small></div></div>`;
}
const logo=`<div class="logo"><span>IND<i>\u25CE</i>GROSIR</span></div>`;
function body(){
  const g=$("#guide").checked;const h=(c)=>g&&c?" hl":"";
  if(S.scr==="login")return `<div class="login screen">${logo}
    <div class="row"><label>Username</label><input id="u" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Username"></div>
    <div class="row"><label>Password</label><input id="p" type="password" autocomplete="off" aria-label="Password"></div>
    <div class="row" style="margin-top:22px"><select id="co" style="border:0;background:transparent;width:100%"><option>IGR</option><option>IDM</option></select></div>
    <div class="err" id="e">${S.err}</div>
    <div class="btns"><button class="btn" id="cancel">CANCEL</button><button class="btn" id="login">LOGIN</button></div></div>`;
  if(S.scr==="menu"){
    const it=["Receiving","Picking","Checker","Scanning","Loading","NRB"].map(x=>`<li data-x="${x}">${x}</li>`).join("");
    return `<div class="screen">${logo}<div class="ver">Connected to : 192.168.83.100<br>Version : 2.8.0</div><ul class="menu">${it}
    <li id="so" class="${S.openSO?"open sel":""}">SO Harian</li>${S.openSO?`<li class="sub" id="sopl">Per Lokasi</li><li class="sub" data-x="Per Shelving">Per Shelving</li><li class="sub" id="sosr">Per Sub Rak</li><li class="sub" id="sodt">Display Toko</li><li class="sub" data-x="SO+">SO+</li>`:""}
